<title>Modal preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@200;300;400&family=Archivo+Narrow:wght@500;600&family=Barlow:wght@300;400&display=swap">
<style>
:root{
  --ink:#0e0c0a; --surface:#161310; --parchment:#f2ede6;
  --p-70:rgba(242,237,230,0.70); --p-50:rgba(242,237,230,0.50); --p-35:rgba(242,237,230,0.35);
  --amber:#c8833a; --amber-lt:#e8a85a; --border:rgba(242,237,230,0.09); --border-md:rgba(242,237,230,0.15);
  --font-display:'Josefin Sans',sans-serif; --font-cond:'Archivo Narrow',sans-serif; --font-body:'Barlow',sans-serif;
  --r-pill:9999px;
}
*{box-sizing:border-box}
body{margin:0;background:#241d18;font-family:var(--font-body);min-height:100vh}
/* fake page behind, to judge the scrim */
.fakepage{position:fixed;inset:0;background:url('https://res.cloudinary.com/dwffvgcj1/image/upload/f_auto,q_auto,c_limit,w_960/v1790031456/kneed-site-modal-bread_lmcs53.jpg') center/cover;filter:saturate(.7)}

.nl-overlay{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(4,3,3,.82);backdrop-filter:blur(3px)}
.nl-card{position:relative;width:100%;max-width:520px;padding:56px 32px;text-align:center}
.nl-bread{
  position:absolute;inset:-88px -72px;
  width:calc(100% + 144px);height:calc(100% + 176px);
  object-fit:cover;
  opacity:0.22;
  filter:saturate(0.65) contrast(0.95);
  -webkit-mask-image:radial-gradient(ellipse 58% 50% at 50% 46%, #000 12%, transparent 68%);
  mask-image:radial-gradient(ellipse 58% 50% at 50% 46%, #000 12%, transparent 68%);
  pointer-events:none;
}
.nl-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:20px}
.nl-rule{width:36px;height:1px}
.nl-rule-amber{background:var(--amber)}
.nl-rule-dim{background:var(--border-md)}
.nl-x{position:absolute;top:-8px;right:0;width:30px;height:30px;z-index:2;border-radius:50%;border:1px solid var(--border-md);background:none;color:var(--p-50);font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.nl-eyebrow{font-family:var(--font-cond);font-weight:600;letter-spacing:.5em;text-transform:uppercase;font-size:.64rem;color:var(--p-50);padding-left:.5em}
.nl-h{font-family:var(--font-display);font-weight:200;font-size:clamp(1.9rem,6vw,2.5rem);line-height:1.28;letter-spacing:.09em;text-transform:uppercase;color:var(--parchment);max-width:14ch}
.nl-body{font-weight:300;color:var(--p-50);font-size:.92rem;line-height:1.65;max-width:300px;margin:0 auto}
.nl-actions{margin-top:10px;display:flex;flex-direction:column;gap:16px;align-items:center}
.nl-cta{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--amber);color:#fff;border:none;cursor:pointer;
  border-radius:var(--r-pill);padding:0.8rem 1.75rem;
  font-family:var(--font-cond);font-size:0.7rem;font-weight:600;
  letter-spacing:0.2em;text-transform:uppercase;line-height:1;
  transition:background .18s,transform .18s;
}
.nl-cta:hover{background:var(--amber-lt);transform:translateY(-1px)}
.nl-btn-ghost{
  background:none;border:none;cursor:pointer;
  font-family:var(--font-cond);font-size:.66rem;font-weight:500;
  letter-spacing:.24em;text-transform:uppercase;color:var(--p-50);padding:4px;
  transition:color .18s;
}
.nl-btn-ghost:hover{color:var(--parchment)}
</style>
<div class="fakepage"></div>
<div class="nl-overlay">
  <div class="nl-card">
    <img class="nl-bread" src="https://res.cloudinary.com/dwffvgcj1/image/upload/f_auto,q_auto,c_limit,w_960/v1790031456/kneed-site-modal-bread_lmcs53.jpg" alt="" aria-hidden="true">
    <button class="nl-x">&times;</button>
    <div class="nl-inner">
      <div class="nl-rule nl-rule-amber"></div>
      <span class="nl-eyebrow">Psst&hellip;</span>
      <div class="nl-h">The next loaf is&nbsp;proving.</div>
      <p class="nl-body">Be first to hear from our next baker.</p>
      <div class="nl-actions">
        <button class="nl-cta" type="button">Yes please</button>
        <button class="nl-btn-ghost" type="button">Maybe later</button>
      </div>
      <div class="nl-rule nl-rule-dim"></div>
    </div>
  </div>
</div>
